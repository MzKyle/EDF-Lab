[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pollen-edf-lab"
version = "0.1.0"
description = "Offline extended-depth-of-field laboratory for microscopy Z-stacks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "opencv-python-headless>=4.12,<5",
    "numpy>=2.2,<3",
    "matplotlib>=3.9,<4",
    "psutil>=6,<8",
    "PyYAML>=6,<7",
]

[project.scripts]
pollen-edf = "pollen_edf.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pollen_edf = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: executes the pinned native focus-stack Windows release"]

[tool.uv]
environments = ["sys_platform == 'win32' or sys_platform == 'linux' or sys_platform == 'darwin'"]
